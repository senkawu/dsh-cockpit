# 一站式构建：macOS(arm64/x64) / Windows(x64/arm64) / Debian(deb) / RedHat(rpm)
# 用法：推送到 GitHub 后在 Actions 页面手动 Run workflow，或 push 自动触发；
#      完成后在每次运行的 Artifacts 里下载安装包。
name: build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  mac-arm64:
    name: macOS Apple Silicon (dmg)
    runs-on: macos-14 # arm64 runner
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx tauri build --bundles app,dmg
        env: { DSH_NODE_MIRROR: "https://cdn.npmmirror.com/binaries/node", DSH_REGISTRY: "https://registry.npmmirror.com" }
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: src-tauri/target/release/bundle/dmg/*.dmg

  mac-x64:
    name: macOS Intel (dmg)
    runs-on: macos-13 # x64 runner
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx tauri build --bundles app,dmg
        env: { DSH_NODE_MIRROR: "https://cdn.npmmirror.com/binaries/node", DSH_REGISTRY: "https://registry.npmmirror.com" }
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: src-tauri/target/release/bundle/dmg/*.dmg

  win-x64:
    name: Windows x64 (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx tauri build --bundles nsis
        env: { DSH_NODE_MIRROR: "https://cdn.npmmirror.com/binaries/node", DSH_REGISTRY: "https://registry.npmmirror.com" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe

  win-arm64:
    name: Windows ARM64 (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-pc-windows-msvc }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx tauri build --target aarch64-pc-windows-msvc --bundles nsis
        env:
          DSH_TARGET_TRIPLE: aarch64-pc-windows-msvc
          DSH_TARGET_PLATFORM: win
          DSH_TARGET_ARCH: arm64
          DSH_NODE_MIRROR: "https://cdn.npmmirror.com/binaries/node"
          DSH_REGISTRY: "https://registry.npmmirror.com"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe

  linux-deb:
    name: Debian/Ubuntu (deb)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libappindicator3-dev libsoup-3.0-dev libssl-dev
      - run: npm install
      - run: npx tauri build --bundles deb
        env: { DSH_NODE_MIRROR: "https://cdn.npmmirror.com/binaries/node", DSH_REGISTRY: "https://registry.npmmirror.com" }
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb

  linux-rpm:
    name: RedHat/Fedora (rpm)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libappindicator3-dev libsoup-3.0-dev libssl-dev rpm
      - run: npm install
      - run: npx tauri build --bundles rpm
        env: { DSH_NODE_MIRROR: "https://cdn.npmmirror.com/binaries/node", DSH_REGISTRY: "https://registry.npmmirror.com" }
      - uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm

  # 全部构建成功后：打标签并创建 GitHub Release，挂载 6 个安装包
  release:
    name: 📦 发布 GitHub Release
    runs-on: ubuntu-latest
    needs: [mac-arm64, mac-x64, win-x64, win-arm64, linux-deb, linux-rpm]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false
      - name: 创建 / 更新 Release（同版本已存在则跳过，避免重复发布）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="v$(node -p "require('./package.json').version")"
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $VERSION 已存在，跳过创建"
            exit 0
          fi
          # 打标签（若不存在则指向当前提交）并上传全部安装包
          git tag "$VERSION" || true
          git push origin "$VERSION" || true
          gh release create "$VERSION" \
            artifacts/*/*.dmg artifacts/*/*.exe artifacts/*/*.deb artifacts/*/*.rpm \
            --repo "$GITHUB_REPOSITORY" \
            --title "DSH-Cockpit $VERSION" \
            --notes "DSH-Cockpit $VERSION 安装包（macOS / Windows / Debian / RedHat）。构建记录见 Actions。" \
            --generate-notes
          echo "::notice::已发布 Release $VERSION"
