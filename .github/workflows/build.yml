# 构建并发布：macOS(arm64) / Windows(x64/arm64)
# 触发：push 到 main/master 或手动 dispatch；成功构建后发布到 GitHub Releases。
# 外壳自更新：bundle.createUpdaterArtifacts=true 产出 .sig 签名，
#      release job 生成 {{target}}-{{arch}}.json 清单并挂到 Release。
name: build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  mac-arm64:
    name: macOS Apple Silicon (dmg)
    runs-on: macos-14 # arm64 runner
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install
      - run: npx tauri build --bundles app,dmg
        env:
          DSH_REGISTRY: "https://registry.npmmirror.com"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.tar.gz
            src-tauri/target/release/bundle/macos/*.sig

  win-x64:
    name: Windows x64 (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install
      - run: npx tauri build --bundles nsis
        env:
          DSH_REGISTRY: "https://registry.npmmirror.com"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig

  win-arm64:
    name: Windows ARM64 (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-pc-windows-msvc }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install
      - run: npx tauri build --target aarch64-pc-windows-msvc --bundles nsis
        env:
          DSH_TARGET_TRIPLE: aarch64-pc-windows-msvc
          DSH_TARGET_PLATFORM: win
          DSH_TARGET_ARCH: arm64
          DSH_REGISTRY: "https://registry.npmmirror.com"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: |
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.sig

  # 三个平台全部构建成功后：打标签并创建 GitHub Release，挂载安装包 + updater 清单
  release:
    name: 📦 发布 GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [mac-arm64, win-x64, win-arm64]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false
      - name: 创建 / 更新 Release（存在则补传资产，避免空 Release）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="v$(node -p "require('./package.json').version")"
          SHORT="${VERSION#v}"
          # 收集安装包（含 updater 用的 .app.tar.gz，清单 URL 指向它）
          FILES=$(find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.app.tar.gz' -o -name '*.tar.gz' \))
          echo "待上传: $FILES"
          # 生成 updater 清单（{{target}}-{{arch}}.json；架构以 artifact 目录名判定）
          python3 - <<'PYEOF'
          import json, os, glob, datetime
          artifacts_dir = "artifacts"
          version = "$SHORT"
          entries = {}  # target -> {url, signature}
          sigs = {}
          for p in glob.glob(artifacts_dir + "/**/*.sig", recursive=True):
              sigs[os.path.basename(p)[:-4]] = open(p).read().strip()
          def guess_target(f):
              p = f.replace("\\", "/").lower()
              n = os.path.basename(f).lower()
              if "/macos-arm64/" in p: return "aarch64-apple-darwin"
              if "/windows-arm64/" in p or ("arm64" in n and n.endswith(".exe")): return "aarch64-pc-windows-msvc"
              if "/windows-x64/" in p: return "x86_64-pc-windows-msvc"
              return None
          files = []
          for ext in (".app.tar.gz", ".exe"):
              files += glob.glob(artifacts_dir + "/**/*" + ext, recursive=True)
          for f in files:
              name = os.path.basename(f)
              target = guess_target(f)
              if not target or target in entries:
                  continue
              signature = sigs.get(name, "")
              if not signature:
                  print(f"::warning::缺少签名文件: {name}")
                  continue
              url = f"https://github.com/{os.environ.get('GITHUB_REPOSITORY','')}/releases/latest/download/{name}"
              entries[target] = {"url": url, "signature": signature}
              print(f"::notice::updater 条目 {target} <- {name}")
          if not entries:
              print("::warning::未找到任何 updater 安装包/签名，跳过清单生成")
              exit(0)
          manifest = {
              "version": version,
              "notes": "DSH-Cockpit 外壳更新",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": entries,
          }
          os.makedirs("update-json", exist_ok=True)
          for target in entries:
              arch = "aarch64" if "aarch64" in target else "x86_64"
              fn = f"{target}-{arch}.json"
              with open(os.path.join("update-json", fn), "w") as fh:
                  json.dump(manifest, fh, indent=2)
              print(f"::notice::生成 updater 清单 {fn}")
          PYEOF
          JSON_FILES=$(find update-json -name '*.json' 2>/dev/null || true)
          echo "清单: $JSON_FILES"
          # Release 存在 → 补传缺失资产；不存在 → 打标签并创建
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $VERSION 已存在，补传缺失资产"
            for f in $FILES $JSON_FILES; do
              gh release upload "$VERSION" "$f" --repo "$GITHUB_REPOSITORY" --clobber \
                || echo "::warning::上传失败（可能已存在）: $f"
            done
          else
            git tag "$VERSION" || true
            git push origin "$VERSION" || true
            # shellcheck disable=SC2086
            gh release create "$VERSION" $FILES $JSON_FILES \
              --repo "$GITHUB_REPOSITORY" \
              --title "DSH-Cockpit $VERSION" \
              --generate-notes
          fi
          echo "::notice::Release $VERSION 就绪"
