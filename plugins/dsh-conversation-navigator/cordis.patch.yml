# ============================================================================
# dsh-conversation-navigator —— DSH bundle patch
# ============================================================================
# 长对话快速导航条（P4 2.5.1）的"挂载声明"。
# DSH 启动时按 bundle 层栈叠加各插件 patch，本文件把导航条插件
# 插入 Web profile 的配置树。
#
# 安装方式（不再需要手工复制/手工改 profile patch）：
#   dsh plugin --profile web add dsh-conversation-navigator
# 或本地开发安装：
#   dsh plugin --profile web add link:<本目录绝对路径>
# ============================================================================

- insert:
    - id: dsh-conversation-navigator
      name: dsh-conversation-navigator
